<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercícios — Maratona Java DevDojo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --card: #1a1a20;
    --border: #2a2a35;
    --accent: #f97316;
    --accent2: #fb923c;
    --java: #e8572a;
    --text: #e8e8f0;
    --muted: #7a7a90;
    --green: #4ade80;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --yellow: #facc15;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #0d0d0f 0%, #1a0a00 50%, #0d0d0f 100%);
    border-bottom: 1px solid var(--border);
    padding: 3rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(249,115,22,0.12) 0%, transparent 70%);
  }

  header::after {
    content: 'JAVA';
    position: absolute;
    font-size: 20rem;
    font-weight: 800;
    color: rgba(249,115,22,0.03);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    letter-spacing: -0.05em;
    font-family: 'Syne', sans-serif;
  }

  .logo-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.2rem 0.7rem;
    border-radius: 2px;
    margin-bottom: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    position: relative;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    position: relative;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    margin-top: 0.75rem;
    font-size: 1rem;
    position: relative;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
    position: relative;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Search + Filter */
  .controls {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.65rem 1rem;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.65rem 1.1rem;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(249,115,22,0.08);
  }

  /* Main layout */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* Section (Module) */
  .module {
    margin-bottom: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color 0.2s;
  }

  .module:hover { border-color: rgba(249,115,22,0.3); }

  .module-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.5rem;
    cursor: pointer;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    user-select: none;
    transition: background 0.2s;
  }

  .module-header:hover { background: rgba(249,115,22,0.05); }

  .module-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    background: rgba(249,115,22,0.1);
    border: 1px solid rgba(249,115,22,0.25);
    border-radius: 4px;
    padding: 0.1rem 0.5rem;
    white-space: nowrap;
  }

  .module-title {
    flex: 1;
    font-weight: 700;
    font-size: 1rem;
  }

  .module-badge {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .chevron {
    color: var(--muted);
    transition: transform 0.25s;
    font-size: 0.85rem;
  }

  .module.open .chevron { transform: rotate(180deg); }

  .module-body {
    display: none;
    padding: 1.25rem 1.5rem;
  }

  .module.open .module-body { display: block; }

  .aula-ref {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 1rem;
    padding: 0.5rem 0.75rem;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid var(--border);
    border-radius: 0 4px 4px 0;
  }

  /* Exercise list */
  .ex-list { list-style: none; }

  .ex-item {
    display: flex;
    gap: 0.85rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    align-items: flex-start;
  }

  .ex-item:last-child { border-bottom: none; }

  .ex-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    min-width: 28px;
    margin-top: 2px;
  }

  .ex-content { flex: 1; }

  .ex-title {
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .ex-detail {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .diff {
    font-size: 0.65rem;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    margin-top: 2px;
  }

  .diff-1 { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
  .diff-2 { background: rgba(96,165,250,0.12); color: var(--blue); border: 1px solid rgba(96,165,250,0.2); }
  .diff-3 { background: rgba(250,204,21,0.12); color: var(--yellow); border: 1px solid rgba(250,204,21,0.2); }
  .diff-4 { background: rgba(249,115,22,0.12); color: var(--accent); border: 1px solid rgba(249,115,22,0.2); }
  .diff-5 { background: rgba(167,139,250,0.12); color: var(--purple); border: 1px solid rgba(167,139,250,0.2); }

  .check-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    min-width: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
    color: transparent;
    font-size: 0.7rem;
  }

  .check-btn:hover { border-color: var(--green); }
  .check-btn.done { background: var(--green); border-color: var(--green); color: #000; }

  /* Progress */
  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    margin-top: 0.6rem;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--java), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 2rem;
    align-items: center;
  }

  .legend-label { font-size: 0.75rem; color: var(--muted); margin-right: 0.5rem; }

  /* Responsive */
  @media (max-width: 600px) {
    .module-header { padding: 0.9rem 1rem; }
    .module-body { padding: 1rem; }
    .stats-bar { gap: 1rem; }
    .stat-num { font-size: 1.5rem; }
  }
</style>
</head>

// ---- Render ----
const main = document.getElementById('main-content');
let allItems = [];

function renderModules(modules) {
  // Clear dynamic content (keep legend)
  const legend = main.querySelector('.legend');
  main.innerHTML = '';
  if (legend) main.appendChild(legend);

  let totalEx = 0;
  modules.forEach((mod, mi) => {
    totalEx += mod.exercises.length;
    const saved = JSON.parse(localStorage.getItem('done_' + mod.id) || '[]');

    const div = document.createElement('div');
    div.className = 'module';
    div.dataset.id = mod.id;

    const doneCount = saved.length;
    const pct = Math.round(doneCount / mod.exercises.length * 100);

    div.innerHTML = `
      <div class="module-header" onclick="toggleModule(this)">
        <span class="module-num">Módulo ${mod.id}</span>
        <span class="module-title">${mod.title}</span>
        <span class="module-badge">${mod.exercises.length} ex. · ${doneCount}/${mod.exercises.length}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="progress-bar-wrap" style="margin:0;border-radius:0">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="module-body">
        <div class="aula-ref"># ${mod.aulas}</div>
        <ul class="ex-list">
          ${mod.exercises.map((ex, ei) => `
            <li class="ex-item" data-diff="${ex.diff}">
              <button class="check-btn ${saved.includes(ei) ? 'done' : ''}" onclick="toggleDone(${mod.id},${ei},this)">✓</button>
              <div class="ex-content">
                <div class="ex-title">${ei+1}. ${ex.title}</div>
              </div>
              <span class="diff diff-${ex.diff}">${['','Iniciante','Básico','Médio','Avançado','Expert'][ex.diff]}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
    main.appendChild(div);
  });

  updateStats();
  document.getElementById('total-mod').textContent = modules.length;
}

function toggleModule(header) {
  header.parentElement.classList.toggle('open');
}

function toggleDone(modId, exIdx, btn) {
  let saved = JSON.parse(localStorage.getItem('done_' + modId) || '[]');
  if (saved.includes(exIdx)) {
    saved = saved.filter(i => i !== exIdx);
    btn.classList.remove('done');
  } else {
    saved.push(exIdx);
    btn.classList.add('done');
  }
  localStorage.setItem('done_' + modId, JSON.stringify(saved));

  // Update badge and progress bar
  const mod = MODULES.find(m => m.id === modId);
  const moduleDiv = document.querySelector(`.module[data-id="${modId}"]`);
  moduleDiv.querySelector('.module-badge').textContent = `${mod.exercises.length} ex. · ${saved.length}/${mod.exercises.length}`;
  const pct = Math.round(saved.length / mod.exercises.length * 100);
  moduleDiv.querySelector('.progress-bar-fill').style.width = pct + '%';

  updateStats();
}

function updateStats() {
  let total = 0, done = 0;
  MODULES.forEach(mod => {
    total += mod.exercises.length;
    const saved = JSON.parse(localStorage.getItem('done_' + mod.id) || '[]');
    done += saved.length;
  });
  document.getElementById('total-ex').textContent = total;
  document.getElementById('total-done').textContent = done;
  document.getElementById('total-pct').textContent = total ? Math.round(done/total*100) + '%' : '0%';
}

// Filtering
let activeDiff = 'all';

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDiff = btn.dataset.diff;
    applyFilters();
  });
});

document.getElementById('searchInput').addEventListener('input', applyFilters);

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.module').forEach(mod => {
    const title = mod.querySelector('.module-title').textContent.toLowerCase();
    const items = mod.querySelectorAll('.ex-item');
    let anyVisible = false;
    items.forEach(item => {
      const text = item.querySelector('.ex-title').textContent.toLowerCase();
      const diff = item.dataset.diff;
      const matchDiff = activeDiff === 'all' || diff === activeDiff;
      const matchQ = !q || text.includes(q) || title.includes(q);
      item.style.display = matchDiff && matchQ ? '' : 'none';
      if (matchDiff && matchQ) anyVisible = true;
    });
    mod.style.display = anyVisible ? '' : 'none';
  });
}

renderModules(MODULES);
